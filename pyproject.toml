[project]
name = "coffee-value-app"
version = "0.1.0"
description = "Inference web app for specialty coffee value analysis."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.111,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "openai>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
coffee-value = "coffee_value_app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
