services:
  - type: web
    name: worth-the-roast
    runtime: python
    plan: free
    buildCommand: python -m pip install .
    startCommand: uvicorn coffee_value_app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TYPESAFE_API_KEY
        sync: false
